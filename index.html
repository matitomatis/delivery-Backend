<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery App</title>

    <style>
        /* CSS: Acá le damos color y forma (Mobile First) */
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #f8f9fa;
            padding-bottom: 80px;
        }

        header {
            background: #ff4757;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .producto {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .precio {
            font-weight: bold;
            color: #2ed573;
        }

        .btn-agregar {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .carrito-flotante {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #2f3542;
            color: white;
            padding: 15px 0;
            display: flex;
            justify-content: space-around;
            cursor: pointer;
        }

        /* CSS: Adaptación para pantallas grandes (Computadoras) */
        @media (min-width: 768px) {
            main {
                max-width: 900px;
                margin: 20px auto;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }

            .producto {
                margin: 0;
            }

            .carrito-flotante {
                max-width: 900px;
                left: 50%;
                transform: translateX(-50%);
                border-radius: 15px 15px 0 0;
            }
        }
    </style>
</head>

<body>
    <!-- HTML: Acá está el esqueleto visual -->
    <header>
        <h2 style="margin: 0;">Menú Delivery</h2>
    </header>

    <main id="lista-productos">
        <p style="text-align: center; width: 100%; padding: 20px;">Cargando menú delicioso...</p>
    </main>

    <div class="carrito-flotante" onclick="abrirCarrito()">
        <span>🛒 Ver Carrito</span>
        <span id="total-carrito">$0</span>
    </div>
    <!-- Ventana oculta de Checkout (Modal) -->
    <div id="ventana-checkout" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto;">

        <h2 style="color: #ff4757; margin-top: 0;">Confirmar Pedido</h2>

        <p><strong>Total a pagar: </strong><span id="total-confirmacion">$0</span></p>

        <label>Tu Nombre:</label><br>
        <input type="text" id="nombreCliente" style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px;"><br>

        <label>¿Retira o Envío?:</label><br>
        <select id="tipoEnvio" style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px;">
            <option value="Envío a domicilio">Envío a domicilio</option>
            <option value="Retiro por el local">Retiro por el local</option>
        </select><br>

        <label>Dirección (si es envío):</label><br>
        <input type="text" id="direccionCliente" style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px;"><br>

        <label>Forma de Pago:</label><br>
        <select id="formaPago" style="width: 100%; padding: 10px; margin: 5px 0 20px 0; border: 1px solid #ccc; border-radius: 5px;">
            <option value="Efectivo">Efectivo</option>
            <option value="Transferencia">Transferencia</option>
        </select><br>

        <button onclick="enviarPedidoWhatsApp()" style="width: 100%; background: #2ed573; color: white; border: none; padding: 15px; border-radius: 5px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-bottom: 10px;">Enviar por WhatsApp</button>

        <button onclick="cerrarCarrito()" style="width: 100%; background: #ccc; color: black; border: none; padding: 15px; border-radius: 5px; font-size: 1.1em; font-weight: bold; cursor: pointer;">Volver al menú</button>
    </div>

    <!-- JAVASCRIPT: Acá está el motorcito que suma la plata -->
    <script>
        async function cargarProductos() {
            try {
                // Vamos a golpear la puerta de tu API
                const respuesta = await fetch('https://localhost:7111/api/Articulos');
                const productosBD = await respuesta.json();

                const contenedor = document.getElementById('lista-productos');
                contenedor.innerHTML = ''; // Borramos el texto de "Cargando..."

                // Recorremos lo que nos devolvió la base de datos
                productosBD.forEach(prod => {
                    // NOTA: Acá uso prod.descripcion por el arreglo que hicimos antes. 
                    // Si en tu base de datos quedó como "nombre", cambialo a prod.nombre.
                    const textoProducto = prod.descripcion;

                    // Dibujamos la tarjeta dinámica
                    contenedor.innerHTML += `
                        <div class="producto">
                            <div>
                                <h3 style="margin: 0;">${textoProducto}</h3>
                                <p class="precio">$${prod.precio}</p>
                            </div>
                            <button class="btn-agregar" onclick="agregarAlCarrito('${textoProducto}', ${prod.precio})">+ Agregar</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error conectando a la API:", error);
                document.getElementById('lista-productos').innerHTML = '<p style="color:red; text-align:center; width:100%;">Error al conectar con la base de datos. ¿Está prendida la API?</p>';
            }
        }

        // Le decimos al navegador que ejecute esta función ni bien se abre la página
        window.onload = cargarProductos;
        let carrito = [];
        let total = 0;

        function agregarAlCarrito(nombreProducto, precio) {
            carrito.push({ nombre: nombreProducto, precio: precio });
            total = total + precio;
            document.getElementById('total-carrito').innerText = '$' + total;
        }

        // Abre la ventana blanca del formulario
        function abrirCarrito() {
            if (carrito.length === 0) {
                alert("El carrito está vacío. ¡Agregá algo rico primero!");
            } else {
                document.getElementById('total-confirmacion').innerText = '$' + total;
                document.getElementById('ventana-checkout').style.display = 'block';
            }
        }

        // Cierra la ventana si el cliente se arrepiente
        function cerrarCarrito() {
            document.getElementById('ventana-checkout').style.display = 'none';
        }

        // Arma el mensaje y abre WhatsApp
        function enviarPedidoWhatsApp() {
            const numeroLocal = "5493510000000"; // Reemplazá por tu número real
            const nombre = document.getElementById('nombreCliente').value;
            const envio = document.getElementById('tipoEnvio').value;
            const direccion = document.getElementById('direccionCliente').value;
            const pago = document.getElementById('formaPago').value;

            // Validamos que haya puesto su nombre
            if (nombre === "") {
                alert("Por favor, ingresá tu nombre.");
                return;
            }

            // Armamos el texto del mensaje
            let mensaje = `¡Hola! Soy ${nombre}. Quiero hacer un pedido:\n\n`;
            mensaje += `🛒 *Mi Carrito:*\n`;

            // Recorremos los productos que eligió
            for (let i = 0; i < carrito.length; i++) {
                mensaje += `- ${carrito[i].nombre} ($${carrito[i].precio})\n`;
            }

            mensaje += `\n🚚 *Entrega:* ${envio}\n`;
            if (envio === "Envío a domicilio") {
                mensaje += `📍 *Dirección:* ${direccion}\n`;
            }
            mensaje += `💵 *Forma de pago:* ${pago}\n`;
            mensaje += `💰 *Total:* $${total}\n`;

            // Transformamos el texto y abrimos WhatsApp
            const urlWhatsApp = `https://wa.me/${numeroLocal}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
