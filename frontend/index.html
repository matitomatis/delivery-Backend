<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Delivery</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f1f2f6;
            padding: 20px;
            margin: 0;
            padding-bottom: 80px;
        }

        h1 {
            text-align: center;
            color: #2f3542;
        }

        h2 {
            color: #ff4757;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-top: 40px;
        }

        .grilla {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .tarjeta {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

            .tarjeta img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 8px;
                background: #eee;
            }

            .tarjeta h3 {
                margin: 15px 0 5px 0;
                color: #2f3542;
                font-size: 1.1em;
            }

        .precio {
            font-size: 1.2em;
            font-weight: bold;
            color: #2ed573;
            margin: 10px 0;
        }

        .categoria {
            font-size: 0.85em;
            color: #747d8c;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .promo-destacada {
            border: 2px solid #ffa502;
        }

        /* Botones de Agregar */
        .btn-agregar {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }

            .btn-agregar:hover {
                background: #e03e4d;
            }

        .promo-destacada .btn-agregar {
            background: #ffa502;
        }

            .promo-destacada .btn-agregar:hover {
                background: #e59400;
            }

        /* Estilos del Carrito */
        .btn-flotante {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ed573;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .btn-flotante:hover {
                background: #26b963;
                transform: scale(1.05);
            }

        .badge {
            background: white;
            color: #2ed573;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .carrito-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 350px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 15px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 1001;
            display: flex;
            flex-direction: column;
        }

            .carrito-panel.abierto {
                right: 0;
            }

        .carrito-header {
            background: #2f3542;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .carrito-header h2 {
                margin: 0;
                font-size: 1.2rem;
                color: white;
                border: none;
                padding: 0;
            }

        .btn-cerrar {
            background: transparent;
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
        }

        .carrito-body {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .carrito-footer {
            padding: 20px;
            border-top: 1px solid #ddd;
            background: white;
        }

        .carrito-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .carrito-item-info {
            flex-grow: 1;
        }

            .carrito-item-info h4 {
                margin: 0 0 5px 0;
                color: #2f3542;
                font-size: 0.95em;
            }

            .carrito-item-info p {
                margin: 0;
                color: #2ed573;
                font-weight: bold;
            }

        .carrito-controles {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-control {
            background: #eee;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #2f3542;
        }

            .btn-control:hover {
                background: #ddd;
            }

        .total-fila {
            display: flex;
            justify-content: space-between;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2f3542;
        }

        .btn-pedir {
            width: 100%;
            background: #2ed573;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }

            .btn-pedir:hover {
                background: #26b963;
            }
    </style>
</head>
<body>

    <div style="padding: 0 20px;">
        <h1>🍔 Nuestro Menú</h1>

        <h2>⭐ Promociones</h2>
        <div id="grilla-promos" class="grilla"></div>

        <h2>🍔 Artículos Individuales</h2>
        <div id="grilla-articulos" class="grilla"></div>
    </div>

    <!-- Botón Flotante del Carrito -->
    <button class="btn-flotante" id="btn-flotante" onclick="toggleCarrito()">
        🛒 Mi Pedido <span class="badge" id="carrito-badge">0</span>
    </button>

    <!-- Panel Lateral del Carrito -->
    <div class="carrito-panel" id="panel-carrito">
        <div class="carrito-header">
            <h2>🛒 Tu Pedido</h2>
            <button class="btn-cerrar" onclick="toggleCarrito()">✖</button>
        </div>
        <div class="carrito-body" id="carrito-body">
            <!-- Los items del carrito se dibujan acá -->
            <p style="text-align:center; color:#999; margin-top:50px;">El carrito está vacío</p>
        </div>
        <div class="carrito-footer">
            <div class="total-fila">
                <span>Total:</span>
                <span id="carrito-total">$0</span>
            </div>
            <button class="btn-pedir" onclick="iniciarPedido()">Ir a Pagar ➔</button>
        </div>
    </div>

    <script>
        const urlArticulos = 'https://localhost:7111/api/Articulos';
        const urlPromos = 'https://localhost:7111/api/Promos';

        // Lógica del Carrito en Memoria
        let carrito = [];

        function toggleCarrito() {
            document.getElementById('panel-carrito').classList.toggle('abierto');
        }

        function agregarAlCarrito(id, nombre, precio, tipo) {
            // Buscamos si ya existe en el carrito
            const itemExistente = carrito.find(i => i.id === id && i.tipo === tipo);

            if (itemExistente) {
                itemExistente.cantidad++;
            } else {
                carrito.push({ id, nombre, precio, tipo, cantidad: 1 });
            }

            actualizarCarrito();

            // Animación visual del botón flotante
            const btn = document.getElementById('btn-flotante');
            btn.style.transform = 'scale(1.15)';
            setTimeout(() => btn.style.transform = 'scale(1)', 200);
        }

        function cambiarCantidad(index, delta) {
            carrito[index].cantidad += delta;
            if (carrito[index].cantidad <= 0) {
                carrito.splice(index, 1); // Si llega a 0, lo borra del array
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const body = document.getElementById('carrito-body');
            const spanTotal = document.getElementById('carrito-total');
            const badge = document.getElementById('carrito-badge');

            body.innerHTML = '';
            let total = 0;
            let cantidadTotal = 0;

            carrito.forEach((item, index) => {
                total += item.precio * item.cantidad;
                cantidadTotal += item.cantidad;

                body.innerHTML += `
                        <div class="carrito-item">
                            <div class="carrito-item-info">
                                <h4>${item.nombre}</h4>
                                <p>$${item.precio}</p>
                            </div>
                            <div class="carrito-controles">
                                <button class="btn-control" onclick="cambiarCantidad(${index}, -1)">-</button>
                                <span>${item.cantidad}</span>
                                <button class="btn-control" onclick="cambiarCantidad(${index}, 1)">+</button>
                            </div>
                        </div>
                    `;
            });

            if (carrito.length === 0) {
                body.innerHTML = '<p style="text-align:center; color:#999; margin-top:50px;">El carrito está vacío 🛒</p>';
            }

            spanTotal.innerText = `$${total}`;
            badge.innerText = cantidadTotal;
        }

        async function iniciarPedido() {
            if (carrito.length === 0) {
                alert("Agregá algo al carrito primero.");
                return;
            }

            // 1. Transformamos nuestro carrito al formato DetallePedidoCreateDTO
            const detalles = carrito.map(item => {
                return {
                    codArticulo: item.tipo === 'articulo' ? item.id : null,
                    codPromo: item.tipo === 'promo' ? item.id : null,
                    cantidad: item.cantidad,
                    precioUnitario: item.precio
                };
            });

            // 2. Armamos el PedidoCreateDTO completo
            // IMPORTANTE: Estamos hardcodeando IDs en 1 para probar la funcionalidad. 
            // Tenés que tener un Cliente con ID 1, FormaPago 1 y TipoEnvio 1 en tu SQL Server.
            const pedido = {
                codCliente: 1,
                codFormaPago: 1,
                codTipoEnvio: 1,
                detalles: detalles
            };

            // 3. Enviamos a la base de datos
            try {
                const res = await fetch('https://localhost:7111/api/Pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pedido)
                });

                if (res.ok) {
                    alert("✅ ¡Pedido registrado con éxito en la base de datos!");
                    carrito = []; // Vaciamos el carrito local
                    actualizarCarrito(); // Limpiamos la pantalla
                    toggleCarrito(); // Cerramos el panel lateral
                } else {
                    alert("❌ Error al guardar. Verificá que exista el Cliente ID 1 en tu BD.");
                }
            } catch (e) {
                alert("❌ Error de conexión al servidor.");
                console.error(e);
            }
        }

        // Carga de Productos
        async function cargarMenu() {
            const imgGris = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22250%22%20height%3D%22200%22%20viewBox%3D%220%200%20250%20200%22%3E%3Crect%20fill%3D%22%23eeeeee%22%20width%3D%22250%22%20height%3D%22200%22%2F%3E%3Ctext%20fill%3D%22%23999999%22%20font-family%3D%22sans-serif%22%20font-size%3D%2218%22%20dy%3D%2210.5%22%20font-weight%3D%22bold%22%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%3ESin%20Foto%3C%2Ftext%3E%3C%2Fsvg%3E";

            // 1. Cargar Promos
            try {
                const resPromo = await fetch(urlPromos);
                const promos = await resPromo.json();
                const divPromo = document.getElementById('grilla-promos');

                divPromo.innerHTML = promos.map(item => {
                    const imgFinal = item.urlImagen || item.UrlImagen || imgGris;
                    const id = item.codPromo || item.CodPromo;
                    const nombreSeguro = item.nombre.replace(/'/g, "\\'"); // Evita errores con comillas simples

                    return `
                        <div class="tarjeta promo-destacada">
                            <img src="${imgFinal}" onerror="this.onerror=null; this.src='${imgGris}';" alt="${item.nombre}">
                            <div>
                                <h3>${item.nombre}</h3>
                                <p class="categoria">${item.categoria}</p>
                                <p class="precio">$${item.precioVenta}</p>
                            </div>
                            <button class="btn-agregar" onclick="agregarAlCarrito(${id}, '${nombreSeguro}', ${item.precioVenta}, 'promo')">Sumar al Pedido 🛒</button>
                        </div>
                    `}).join('');
            } catch (e) { console.error("Error con promos", e); }

            // 2. Cargar Artículos
            try {
                const resArt = await fetch(urlArticulos);
                const articulos = await resArt.json();
                const divArt = document.getElementById('grilla-articulos');

                divArt.innerHTML = articulos.map(item => {
                    const imgFinal = item.urlImagen || item.UrlImagen || imgGris;
                    const id = item.codArticulo || item.CodArticulo;
                    const nombreSeguro = item.descripcion.replace(/'/g, "\\'");

                    return `
                        <div class="tarjeta">
                            <img src="${imgFinal}" onerror="this.onerror=null; this.src='${imgGris}';" alt="${item.descripcion}">
                            <div>
                                <h3>${item.descripcion}</h3>
                                <p class="precio">$${item.costo}</p>
                            </div>
                            <button class="btn-agregar" onclick="agregarAlCarrito(${id}, '${nombreSeguro}', ${item.costo}, 'articulo')">Sumar al Pedido 🛒</button>
                        </div>
                    `}).join('');
            } catch (e) { console.error("Error con artículos", e); }
        }

        window.onload = cargarMenu;
    </script>
</body>
</html>
