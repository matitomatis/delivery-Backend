<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Delivery</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f1f2f6;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2f3542;
        }

        h2 {
            color: #ff4757;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-top: 40px;
        }

        .grilla {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .tarjeta {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

            .tarjeta img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 8px;
                background: #eee;
            }

            .tarjeta h3 {
                margin: 15px 0 5px 0;
                color: #2f3542;
            }

        .precio {
            font-size: 1.2em;
            font-weight: bold;
            color: #2ed573;
            margin: 10px 0;
        }

        .categoria {
            font-size: 0.85em;
            color: #747d8c;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .promo-destacada {
            border: 2px solid #ffa502;
        }
    </style>
</head>
<body>

    <h1>🍔 Nuestro Menú</h1>

    <h2>⭐ Promociones</h2>
    <div id="grilla-promos" class="grilla"></div>

    <h2>🍔 Artículos Individuales</h2>
    <div id="grilla-articulos" class="grilla"></div>

    <script>
        const urlArticulos = 'https://localhost:7111/api/Articulos';
        const urlPromos = 'https://localhost:7111/api/Promos';

        async function cargarMenu() {
            // Imagen SVG incrustada (no requiere internet)
            const imgGris = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22250%22%20height%3D%22200%22%20viewBox%3D%220%200%20250%20200%22%3E%3Crect%20fill%3D%22%23eeeeee%22%20width%3D%22250%22%20height%3D%22200%22%2F%3E%3Ctext%20fill%3D%22%23999999%22%20font-family%3D%22sans-serif%22%20font-size%3D%2218%22%20dy%3D%2210.5%22%20font-weight%3D%22bold%22%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%3ESin%20Foto%3C%2Ftext%3E%3C%2Fsvg%3E";

            // 1. Cargar Promos
            try {
                const resPromo = await fetch(urlPromos);
                const promos = await resPromo.json();
                const divPromo = document.getElementById('grilla-promos');

                divPromo.innerHTML = promos.map(item => {
                    const imgFinal = item.urlImagen || item.UrlImagen || imgGris;

                    return `
                        <div class="tarjeta promo-destacada">
                            <img src="${imgFinal}" onerror="this.onerror=null; this.src='${imgGris}';" alt="${item.nombre}">
                            <h3>${item.nombre}</h3>
                            <p class="categoria">${item.categoria}</p>
                            <p class="precio">$${item.precioVenta}</p>
                        </div>
                    `}).join('');
            } catch (e) { console.error("Error con promos", e); }

            // 2. Cargar Artículos
            try {
                const resArt = await fetch(urlArticulos);
                const articulos = await resArt.json();
                const divArt = document.getElementById('grilla-articulos');

                divArt.innerHTML = articulos.map(item => {
                    const imgFinal = item.urlImagen || item.UrlImagen || imgGris;

                    return `
                        <div class="tarjeta">
                            <img src="${imgFinal}" onerror="this.onerror=null; this.src='${imgGris}';" alt="${item.descripcion}">
                            <h3>${item.descripcion}</h3>
                            <p class="precio">$${item.costo}</p>
                        </div>
                    `}).join('');
            } catch (e) { console.error("Error con artículos", e); }
        }

        window.onload = cargarMenu;
    </script>
</body>
</html>
