<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Dolce - Delivery</title>
    <style>
        :root {
            --primary: #dc2626;
            --primary-light: #fef2f2;
            --bg: #f8f9fa;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --white: #ffffff;
            --border: #f3f4f6;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding-bottom: 100px;
            color: var(--text-dark);
        }

        .top-nav {
            background: var(--white);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-dark);
            cursor: pointer;
            padding: 0;
        }

        .logo-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .cart-icon-btn {
            position: relative;
            background: var(--bg);
            border: none;
            border-radius: 12px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-container {
            padding: 10px 20px;
            background: var(--white);
        }

        .search-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

            .search-box-wrapper span {
                position: absolute;
                left: 15px;
                color: var(--text-muted);
                font-size: 1.2rem;
            }

        .search-box {
            background: var(--bg);
            border-radius: 12px;
            padding: 14px 15px 14px 45px;
            border: 1px solid transparent;
            width: 100%;
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

            .search-box:focus {
                border-color: var(--primary);
                background: var(--white);
            }

        .banner-container {
            display: flex;
            gap: 15px;
            padding: 15px 20px;
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--white);
        }

            .banner-container::-webkit-scrollbar {
                display: none;
            }

        .banner {
            min-width: 280px;
            height: 110px;
            border-radius: 16px;
            padding: 15px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }

            .banner h3 {
                margin: 0;
                font-size: 1.3rem;
            }

            .banner p {
                margin: 5px 0 0 0;
                font-size: 0.9rem;
                opacity: 0.9;
            }

        .categorias {
            display: flex;
            padding: 10px 20px 20px 20px;
            gap: 15px;
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--white);
            border-bottom: 1px solid var(--border);
        }

            .categorias::-webkit-scrollbar {
                display: none;
            }

        .cat-item {
            background: var(--bg);
            min-width: 85px;
            height: 95px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .cat-icon {
            font-size: 1.5rem;
        }

        .cat-item.active {
            background: var(--primary-light);
            border-color: #fecaca;
            color: var(--primary);
        }

            .cat-item.active .cat-icon {
                filter: grayscale(0%);
            }

        .seccion-vista {
            display: none;
            padding: 20px;
        }

            .seccion-vista.activa {
                display: block;
            }

        .seccion-header-flex {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .seccion-titulo {
            margin: 0;
            font-size: 1.4rem;
            color: var(--text-dark);
        }

        .seccion-subtitulo {
            margin: 0 0 20px 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .producto {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .producto-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 15px;
        }

            .producto-info h3 {
                margin: 0 0 5px 0;
                font-size: 1.1rem;
                color: var(--text-dark);
            }

            .producto-info p.desc {
                margin: 0 0 15px 0;
                font-size: 0.85rem;
                color: var(--text-muted);
            }

        .precio {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.4rem;
        }

        .producto-img-container {
            position: relative;
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .producto-img-container img {
                width: 100%;
                max-height: 120px;
                object-fit: contain;
                border-radius: 12px;
            }

        .btn-add {
            position: absolute;
            bottom: -10px;
            right: -10px;
            background: var(--white);
            color: var(--primary);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
            border: none;
        }

            .btn-add:active {
                transform: scale(0.9);
            }

        /* Inicialmente oculto con display: none */
        .carrito-flotante {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--primary);
            color: var(--white);
            padding: 18px 25px;
            border-radius: 16px;
            display: none;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.4);
            z-index: 999;
            cursor: pointer;
        }

        .cart-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
        }

        .carrito-cantidad-badge {
            background: rgba(255, 255, 255, 0.2);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 1.1rem;
        }

        .cart-right {
            text-align: right;
        }

        .cart-total-text {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .cart-subtext {
            font-size: 0.75rem;
            font-weight: normal;
            opacity: 0.9;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-content {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            height: 90vh;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            background: var(--bg);
        }

        .modal-step {
            display: none;
        }

            .modal-step.activa {
                display: block;
            }

        .cart-item {
            background: var(--white);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            position: relative;
        }

        .cart-item-img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
        }

            .cart-item-info h4 {
                margin: 0 0 5px 0;
                font-size: 0.95rem;
                padding-right: 25px;
            }

            .cart-item-info .precio {
                color: var(--primary);
                font-size: 0.95rem;
                margin-bottom: 10px;
            }

        .qty-controls {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .qty-btn {
            background: var(--white);
            border: none;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        .qty-val {
            padding: 5px 12px;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            font-size: 0.95rem;
            font-weight: bold;
        }

        .btn-trash {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .resumen-box {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .resumen-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

            .resumen-row.total {
                font-weight: bold;
                font-size: 1.15rem;
                color: var(--text-dark);
                margin-top: 15px;
                padding-top: 15px;
                border-top: 1px solid var(--border);
            }

                .resumen-row.total .monto {
                    color: var(--primary);
                }

        .form-group {
            margin-bottom: 15px;
        }

            .form-group label {
                display: block;
                font-weight: 600;
                font-size: 0.85rem;
                color: var(--text-muted);
                margin-bottom: 5px;
            }

            .form-group input, .form-group select {
                width: 100%;
                padding: 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                box-sizing: border-box;
                font-size: 0.95rem;
                background: var(--white);
            }

        .modal-footer {
            padding: 20px;
            background: var(--white);
            border-top: 1px solid var(--border);
        }

        .btn-principal {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        
        <div style="width: 45px;"></div>

        <div class="logo-container">
            <img src="Gemini_Generated_Image_s0p106s0p106s0p1 (1).jfif" alt="La Dolce" class="logo-img">
        </div>

        <button class="cart-icon-btn" onclick="abrirModalCarrito()">
            🛍️
            <div class="cart-badge" id="nav-cart-badge">0</div>
        </button>
    </div>

    <div class="search-container">
        <div class="search-box-wrapper">
            <span>🔍</span>
            <input type="text" class="search-box" placeholder="Buscar porciones, postres, tortas...">
        </div>
    </div>

    <div class="banner-container" id="caja-banners"></div>
    <div class="categorias" id="caja-categorias"></div>
    <div id="contenedor-vistas"></div>

    <div class="carrito-flotante" onclick="abrirModalCarrito()">
        <div class="cart-left">
            <div class="carrito-cantidad-badge" id="cant-flotante">0</div>
            <div>Ver pedido</div>
        </div>
        <div class="cart-right">
            <div class="cart-total-text" id="total-flotante">$0,00</div>
            <div class="cart-subtext">Total estimado</div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-cart">
        <div class="modal-content">

            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="btn-icon" id="btn-volver" style="display:none;" onclick="irPaso(1)">🔙</button>
                    <h2 id="modal-titulo" style="margin: 0; font-size: 1.2rem;">Tu Carrito</h2>
                </div>
                <button class="btn-icon" onclick="cerrarModalCarrito()">✖</button>
            </div>

            <div class="modal-body">
                <div id="paso-1" class="modal-step activa">
                    <p style="margin-top:0; color:var(--text-muted); font-size:0.9rem;">Revisá tus productos antes de continuar</p>
                    <div id="lista-carrito-items"></div>
                    <div class="resumen-box">
                        <div class="resumen-row"><span id="txt-subtotal-cant">Subtotal (0)</span><span id="txt-subtotal-monto">$0</span></div>
                        <div class="resumen-row"><span>Envío</span><span id="txt-envio-monto">$0</span></div>
                        <div class="resumen-row total"><span>Total</span><span class="monto" id="txt-total-monto">$0</span></div>
                    </div>
                </div>

                <div id="paso-2" class="modal-step">
                    <p style="margin-top:0; color:var(--text-muted); font-size:0.9rem;">Completá la información para continuar</p>
                    <div class="form-group"><label>👤 Tu Nombre y Apellido</label><input type="text" id="cli-nombre" placeholder="Ej: Lucas Martinez"></div>
                    <div class="form-group"><label>📍 Dirección de Entrega</label><input type="text" id="cli-direccion" placeholder="Calle, número, piso/depto"></div>
                    <div class="form-group"><label>📞 Teléfono de Contacto</label><input type="tel" id="cli-telefono" placeholder="Ej: 351 1234567"></div>
                    <div class="form-group">
                        <label>💳 Forma de Pago</label>
                        <select id="cli-pago" onchange="verificarMetodoPago()">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Mercado Pago / Transferencia">Mercado Pago / Transferencia</option>
                        </select>
                    </div>
                    <div class="form-group" id="caja-efectivo">
                        <label>💵 ¿Con cuánto vas a pagar? (Para el vuelto)</label>
                        <input type="number" id="cli-abona-con" placeholder="Ej: 30000">
                    </div>

                    <div class="resumen-box" style="margin-top:20px; padding:15px;">
                        <div style="font-weight:bold; margin-bottom:15px; font-size:0.9rem;">✅ Resumen de tu pedido</div>
                        <div class="resumen-row"><span id="txt2-subtotal-cant">0 productos</span><span id="txt2-subtotal-monto">$0</span></div>
                        <div class="resumen-row"><span>Envío</span><span id="txt2-envio-monto">$0</span></div>
                        <div class="resumen-row total" style="margin-top:5px; padding-top:10px;"><span>Total a pagar</span><span class="monto" id="txt2-total-monto">$0</span></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-principal" id="btn-accion-modal" onclick="irPaso(2)">Continuar</button>
            </div>

        </div>
    </div>

    <script>
        const baseURL = 'https://localhost:7111/api';
        const imgGris = "https://via.placeholder.com/150/555555/ffffff?text=Sin+Foto";

        let costoEnvioFijo = 0;
        let carrito = {};

        async function inicializarApp() {
            try {
                const resEnvio = await fetch(`${baseURL}/TarifaEnvio`);
                if (resEnvio.ok) { costoEnvioFijo = await resEnvio.json(); }
            } catch (e) { }
            await cargarMenu();
        }

        function filtrarCategoria(idSeccion, elementoBoton) {
            document.querySelectorAll('#contenedor-vistas .seccion-vista').forEach(sec => sec.classList.remove('activa'));
            document.getElementById(idSeccion).classList.add('activa');
            document.querySelectorAll('.cat-item').forEach(btn => btn.classList.remove('active'));
            elementoBoton.classList.add('active');
        }

        function obtenerIconoCategoria(nombre) {
            const n = nombre.toLowerCase();
            if (n.includes('bebida')) return '🥤';
            if (n.includes('helado')) return '🍦';
            if (n.includes('promo') || n.includes('combo')) return '🏷️';
            if (n.includes('torta') || n.includes('postre')) return '🍰';
            if (n.includes('golosina') || n.includes('alfajor')) return '🍪';
            return '🍽️';
        }

        async function cargarMenu() {
            try {
                const resBanners = await fetch(`${baseURL}/Banners`);
                const banners = await resBanners.json();
                banners.forEach(b => { document.getElementById('caja-banners').innerHTML += `<div class="banner" style="background-color: ${b.backgroundColor || '#fa0050'};"><h3>${b.titulo}</h3><p>${b.subtitulo || ''}</p></div>`; });

                const cajaCategorias = document.getElementById('caja-categorias'), contenedorVistas = document.getElementById('contenedor-vistas');

                cajaCategorias.innerHTML += `<div class="cat-item active" onclick="filtrarCategoria('seccion-promos', this)"><span class="cat-icon">🏷️</span>Promos</div>`;
                contenedorVistas.innerHTML += `
                        <div id="seccion-promos" class="seccion-vista activa">
                            <div class="seccion-header-flex">
                                <span class="cat-icon" style="color:var(--primary); font-size:1.8rem;">🏷️</span>
                                <h2 class="seccion-titulo">Promociones</h2>
                            </div>
                            <p class="seccion-subtitulo">Combos especiales para vos</p>
                            <div id="lista-promos-contenido"></div>
                        </div>`;

                const resPromo = await fetch(`${baseURL}/Promos`);
                const promos = await resPromo.json();
                if (promos.length > 0) {
                    promos.forEach(item => {
                        const img = item.urlImagen || imgGris;
                        document.getElementById('lista-promos-contenido').innerHTML += `
                                <div class="producto">
                                    <div class="producto-info">
                                        <h3>${item.nombre}</h3>
                                        <p class="desc">¡Combo Especial!</p>
                                        <div class="precio">$${item.precioVenta}</div>
                                    </div>
                                    <div class="producto-img-container">
                                        <img src="${img}">
                                        <button class="btn-add" onclick="agregarAlCarrito('${item.nombre.replace(/'/g, "\\'")}', ${item.precioVenta}, '${img}')">+</button>
                                    </div>
                                </div>`;
                    });
                }

                const resCat = await fetch(`${baseURL}/Categorias`);
                const categorias = await resCat.json();
                categorias.forEach(cat => {
                    const icono = obtenerIconoCategoria(cat.nombre);
                    cajaCategorias.innerHTML += `<div class="cat-item" onclick="filtrarCategoria('seccion-cat-${cat.codCategoria}', this)"><span class="cat-icon">${icono}</span>${cat.nombre}</div>`;
                    contenedorVistas.innerHTML += `
                            <div id="seccion-cat-${cat.codCategoria}" class="seccion-vista">
                                <div class="seccion-header-flex">
                                    <span class="cat-icon" style="color:var(--primary); font-size:1.8rem;">${icono}</span>
                                    <h2 class="seccion-titulo">${cat.nombre}</h2>
                                </div>
                                <p class="seccion-subtitulo">Las mejores opciones para vos</p>
                                <div id="lista-cat-${cat.codCategoria}"></div>
                            </div>`;
                });

                const resArt = await fetch(`${baseURL}/Articulos`);
                const articulos = await resArt.json();
                articulos.forEach(item => {
                    const div = document.getElementById(`lista-cat-${item.categoriaId || item.CategoriaId}`);
                    if (div) {
                        const img = item.urlImagen || imgGris;
                        div.innerHTML += `
                                <div class="producto">
                                    <div class="producto-info">
                                        <h3>${item.descripcion}</h3>
                                        <p class="desc">Sabor original</p>
                                        <div class="precio">$${item.costo || item.Costo}</div>
                                    </div>
                                    <div class="producto-img-container">
                                        <img src="${img}">
                                        <button class="btn-add" onclick="agregarAlCarrito('${item.descripcion.replace(/'/g, "\\'")}', ${item.costo || item.Costo}, '${img}')">+</button>
                                    </div>
                                </div>`;
                    }
                });
            } catch (e) { }
        }

        function agregarAlCarrito(nombre, precio, imgUrl) {
            if (!carrito[nombre]) carrito[nombre] = { precio: precio, cantidad: 1, img: imgUrl };
            else carrito[nombre].cantidad++;
            actualizarUIFlotante(); renderizarItemsModal();
        }

        function restarDelCarrito(nombre) {
            if (carrito[nombre]) { carrito[nombre].cantidad--; if (carrito[nombre].cantidad <= 0) delete carrito[nombre]; }
            actualizarUIFlotante(); renderizarItemsModal();
        }

        function eliminarDelCarrito(nombre) {
            delete carrito[nombre];
            actualizarUIFlotante();
            renderizarItemsModal();
            if (Object.keys(carrito).length === 0) cerrarModalCarrito();
        }

        function calcularTotales() {
            let cantItems = 0, subtotal = 0;
            for (let n in carrito) { cantItems += carrito[n].cantidad; subtotal += (carrito[n].precio * carrito[n].cantidad); }
            return { cantItems, subtotal, totalGeneral: cantItems > 0 ? subtotal + costoEnvioFijo : 0 };
        }

        function actualizarUIFlotante() {
            const t = calcularTotales();
            document.getElementById('nav-cart-badge').innerText = t.cantItems;
            document.getElementById('cant-flotante').innerText = t.cantItems;
            document.getElementById('total-flotante').innerText = '$' + t.subtotal;

            // Oculta el botón flotante si no hay ítems
            const btnFlotante = document.querySelector('.carrito-flotante');
            if (t.cantItems > 0) {
                btnFlotante.style.display = 'flex';
            } else {
                btnFlotante.style.display = 'none';
            }
        }

        function renderizarItemsModal() {
            const lista = document.getElementById('lista-carrito-items'); lista.innerHTML = '';
            for (let n in carrito) {
                let i = carrito[n];
                lista.innerHTML += `<div class="cart-item"><img src="${i.img}" class="cart-item-img"><div class="cart-item-info"><h4>${n}</h4><div class="precio">$${i.precio}</div><div class="qty-controls"><button class="qty-btn" onclick="restarDelCarrito('${n}')">−</button><span class="qty-val">${i.cantidad}</span><button class="qty-btn" onclick="agregarAlCarrito('${n}', ${i.precio}, '${i.img}')">+</button></div></div><button class="btn-trash" onclick="eliminarDelCarrito('${n}')">🗑️</button></div>`;
            }
            const t = calcularTotales();
            document.getElementById('txt-subtotal-cant').innerText = `Subtotal (${t.cantItems})`; document.getElementById('txt-subtotal-monto').innerText = '$' + t.subtotal; document.getElementById('txt-envio-monto').innerText = '$' + costoEnvioFijo; document.getElementById('txt-total-monto').innerText = '$' + t.totalGeneral;
            document.getElementById('txt2-subtotal-cant').innerText = `${t.cantItems} productos`; document.getElementById('txt2-subtotal-monto').innerText = '$' + t.subtotal; document.getElementById('txt2-envio-monto').innerText = '$' + costoEnvioFijo; document.getElementById('txt2-total-monto').innerText = '$' + t.totalGeneral;
        }

        function abrirModalCarrito() { if (Object.keys(carrito).length === 0) return alert("Agregá productos primero."); renderizarItemsModal(); document.getElementById('modal-cart').style.display = 'flex'; irPaso(1); }
        function cerrarModalCarrito() { document.getElementById('modal-cart').style.display = 'none'; }

        function irPaso(paso) {
            document.querySelectorAll('#modal-cart .modal-step').forEach(s => s.classList.remove('activa'));

            const btnAccion = document.getElementById('btn-accion-modal');
            const titulo = document.getElementById('modal-titulo');
            const btnVolver = document.getElementById('btn-volver');

            if (paso === 1) {
                document.getElementById('paso-1').classList.add('activa');
                btnVolver.style.display = 'none';
                titulo.innerText = 'Tu Carrito';
                btnAccion.innerText = 'Continuar';
                btnAccion.setAttribute('onclick', 'irPaso(2)');
            } else if (paso === 2) {
                if (Object.keys(carrito).length === 0) { cerrarModalCarrito(); return; }
                document.getElementById('paso-2').classList.add('activa');
                btnVolver.style.display = 'block';
                titulo.innerText = 'Tus Datos de Envío';
                btnAccion.innerText = 'Enviar pedido por WhatsApp';
                btnAccion.setAttribute('onclick', 'enviarPedidoWhatsApp()');
            }
        }

        function verificarMetodoPago() { document.getElementById('caja-efectivo').style.display = (document.getElementById('cli-pago').value === 'Efectivo') ? 'block' : 'none'; }

        function enviarPedidoWhatsApp() {
            const nombre = document.getElementById('cli-nombre').value.trim();
            const direccion = document.getElementById('cli-direccion').value.trim();
            const telefono = document.getElementById('cli-telefono').value.trim();
            const pago = document.getElementById('cli-pago').value;
            const abonaCon = document.getElementById('cli-abona-con').value.trim();

            if (!nombre || !direccion || !telefono) {
                return alert("Por favor, completá todos tus datos (Nombre, Dirección y Teléfono).");
            }

            const t = calcularTotales();

            if (pago === 'Efectivo') {
                if (!abonaCon) {
                    return alert("Por favor, indicá con cuánto vas a pagar para poder enviarte el vuelto correcto.");
                }
                if (parseFloat(abonaCon) < t.totalGeneral) {
                    return alert(`El monto a abonar ($${abonaCon}) debe ser mayor o igual al total de tu compra ($${t.totalGeneral}).`);
                }
            }

            let texto = `¡Hola *La Dolce*! Quisiera hacer el siguiente pedido:\n\n`;
            texto += `*MI PEDIDO:*\n`;

            for (let p in carrito) {
                texto += `- ${carrito[p].cantidad}x ${p} ($${carrito[p].precio * carrito[p].cantidad})\n`;
            }

            texto += `Envío: $${costoEnvioFijo}\n`;
            texto += `*Total a pagar: $${t.totalGeneral}*\n\n`;

            texto += `*MIS DATOS:*\n`;
            texto += `Nombre: ${nombre}\n`;
            texto += `Dirección: ${direccion}\n`;
            texto += `Teléfono: ${telefono}\n`;

            if (pago === 'Efectivo') {
                texto += `Pago: Efectivo (Abona con $${abonaCon})\n`;
            } else {
                texto += `Pago: ${pago}\n`;
            }

            const textoCodificado = encodeURIComponent(texto);
            const numeroWhatsApp = "5491100000000";

            window.open(`https://wa.me/${numeroWhatsApp}?text=${textoCodificado}`, '_blank');
            window.location.reload();
        }

        window.onload = inicializarApp;
    </script>
</body>
</html>
