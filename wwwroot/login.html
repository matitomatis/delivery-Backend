<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - La Dolce</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #e63946;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

            button:hover {
                background-color: #d62828;
            }

        .error {
            color: red;
            font-size: 14px;
            display: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <!-- ACÁ VA EL LOGO DE LA DOLCE -->
        <img src="ladolce.png" alt="Logo La Dolce" class="login-logo">

        <div id="error-msg" class="error">Usuario o contraseña incorrectos</div>
        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script>
                document.getElementById('loginForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const usuario = document.getElementById('usuario')['value'];
                    const password = document.getElementById('password')['value'];

                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usuario, password })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('adminToken', data.token);
                        window.location.href = '/adminladolce';
                    } else {
                        document.getElementById('error-msg').style.display = 'block';
                    }
                });
    </script>
</body>
</html>
